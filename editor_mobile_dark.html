<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mobile Editor (DARK)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body style="background-color: #05070a; color: #a9b1d6; font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center;">
  <div style="width: 375px; height: 667px; background-color: #0d1117; border: 1px solid #24283b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column;">
    <div style="height: 50px; border-bottom: 1px solid #00d2ff; display: flex; align-items: center; padding: 0 1rem; justify-content: space-between;">
      <div style="color: #00d2ff; font-weight: bold;">☰ Aura Editor</div>
      <div style="font-family: 'Fira Code', monospace; font-size: 0.75rem; color: #9333ea;">[Develop]</div>
    </div>
    <div style="padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 1rem;">
      <div style="background-color: #05070a; padding: 1rem; border-radius: 4px; border: 1px solid #24283b; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;">
        <div style="font-family: 'Fira Code', monospace; color: #00d2ff; font-size: 0.8rem; margin-bottom: 0.5rem;">skill.py</div>
                <div style="font-family: 'Fira Code', monospace; font-size: 0.7rem; color: #c0caf5; margin: 0; white-space: pre-wrap;"><span style="color:#bb9af3; font-weight:600;">def</span> <span style="color:#7aa2f7;">execute</span>(<span style="color:#e0af68;">args</span>: <span style="color:#2ac3de;">dict</span>) <span style="color:#89ddff;">-&gt;</span> <span style="color:#2ac3de;">dict</span>:
    <span style="text-decoration: underline wavy #eab308; text-underline-offset: 2px;">unused</span> <span style="color:#89ddff;">=</span> <span style="color:#9ece6a;">"x"</span>
    <span style="text-decoration: underline wavy #ef4444; text-underline-offset: 2px; background-color: rgba(239, 68, 68, 0.1);">network</span>.<span style="color:#7aa2f7;">fetch</span>()
    <span style="color:#bb9af3; font-weight:600;">return</span> {<span style="color:#9ece6a;">"status"</span>: <span style="color:#9ece6a;">"ok"</span>}</div>
      </div>
      <div style="margin-top: auto; display: flex; gap: 0.5rem;">
        <button style="flex: 1; background: transparent; border: 1px solid #00d2ff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; color: #00d2ff; padding: 10px; border-radius: 4px;">测试</button>
        <button style="flex: 1; background: #9333ea; border: none; color: #ffffff; padding: 10px; border-radius: 4px;">部署</button>
      </div>
    </div>
  </div>
</body>
</html>
