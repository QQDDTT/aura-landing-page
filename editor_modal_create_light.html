<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Create Skill Modal (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f5f6f9; color: #3b4261; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 2rem;">
  <div style="width: 480px; background-color: #ffffff; border: 1px solid #00d2ff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border-radius: 4px; padding: 1.5rem;">
    <div style="font-family: 'Fira Code', monospace; color: #00d2ff; margin-bottom: 1rem; border-bottom: 1px solid #24283b; padding-bottom: 0.5rem;">
      > 新建技能配置
    </div>
    <div style="margin-bottom: 1rem;">
      <label style="font-size: 0.75rem; color: #718096; font-family: 'Fira Code', monospace;">SKILL_TITLE // 句柄</label>
      <input type="text" value="new_skill" style="width: 100%; box-sizing: border-box; background: #f5f6f9; border: 1px solid #3b4261; border-radius: 3px; padding: 8px; color: #2d3748; margin-top: 4px;">
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem;">
      <button style="background: transparent; border: 1px solid #3b4261; color: #3b4261; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-size: 0.8rem;">取消</button>
      <button style="background: #00d2ff; border: none; color: #f5f6f9; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 0.8rem;">初始化实体 >></button>
    </div>
  </div>
</body>
</html>
