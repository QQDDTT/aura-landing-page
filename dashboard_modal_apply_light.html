<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.3.3 弹窗：配置应用确认 (Apply Confirmation Modal) (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>.mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
  .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #4a5568; }
  .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
  .mock-footer { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; border-bottom: 2px solid #3182ce; margin-top: 0.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  @media (max-width: 768px) {
    .mock-nav { display: none; }
    .mock-mobile-btn { display: block; }
    .mock-flex-row { flex-direction: column; }
    .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
  }</style>
  <style>
    body {
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      margin: 0;
      padding: 2rem;
      background-color: #faf9f8;
      color: #2d3748;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
</style>
</head>
<body>
<div class="aura-light-theme">
  <div style="margin-top: 1rem; margin-bottom: 2rem; padding: 1.5rem; background: #faf9f8; border: 1px solid #e53e3e; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); max-width: 500px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem;">
        <span style="color: #e53e3e; font-size: 1.2rem;">⚠️</span>
        <h3 style="color: #e53e3e; margin: 0; font-size: 1rem;">警告：人格核心重塑 (Core Override)</h3>
    </div>
    <div style="color: #2d3748; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.5;">
        修改系统规则或核心参数可能导致当前活跃的认知会话发生断裂。是否强制重载新的 VFE 边界？
    </div>
    <div style="display: flex; gap: 10px; font-family: monospace; font-size: 0.75rem; margin-bottom: 1.5rem;">
        <div style="flex: 1; background: rgba(229, 62, 62, 0.05); border: 1px solid rgba(229, 62, 62, 0.2); padding: 8px; border-radius: 6px; color: #718096; text-decoration: line-through;">
            Old: MLP Threshold = 0.85
        </div>
        <div style="flex: 1; background: rgba(16,185,129,0.05); border: 1px solid rgba(56, 161, 105, 0.2); padding: 8px; border-radius: 6px; color: #38a169;">
            New: MLP Threshold = 0.60
        </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <span style="padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; color: #718096; cursor: pointer; border: 1px solid #e2e8f0;">取消 (Cancel)</span>
        <span style="padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; color: #fff; background: #e53e3e; cursor: pointer; box-shadow: 0 0 10px rgba(229, 62, 62, 0.5);">强制应用 (Force Apply)</span>
    </div>
</div>
</div>
</body>
</html>
