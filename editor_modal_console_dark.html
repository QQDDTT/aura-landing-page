<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CI/CD Console Modal (DARK)</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body style="background-color: #05070a; color: #c0caf5; font-family: 'Fira Code', monospace; display: flex; justify-content: center; padding: 2rem;">
  <div style="width: 600px; background-color: #0d1117; border: 1px solid #9333ea; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; border-radius: 4px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <div style="color: #9333ea; margin-bottom: 1rem; border-bottom: 1px dashed #24283b; padding-bottom: 0.5rem;">
      [SYSTEM_CONSOLE] CI/CD Sandbox Validation
    </div>
    <div style="font-size: 0.8rem; line-height: 1.6; height: 150px; overflow-y: auto;">
      <div style="color: #565f89;">> 初始化沙箱环境...</div>
      <div style="color: #00d2ff;">> 挂载依赖包: google-api-python-client...</div>
      <div style="color: #a9b1d6;">> 静态审计通过 (0 警告)</div>
      <div style="color: #00d2ff;">> 试运行完成. 耗时: 124ms</div>
    </div>
    <div style="margin-top: 1rem; text-align: right;">
      <button style="background: #9333ea; border: none; color: #ffffff; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 0.75rem;">关闭控制台</button>
    </div>
  </div>
</body>
</html>
