<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.1.1 移动端：核心主监控台 (Core Dashboard) (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>.mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
  .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #4a5568; }
  .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
  .mock-footer { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; border-bottom: 2px solid #3182ce; margin-top: 0.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  @media (max-width: 768px) {
    .mock-nav { display: none; }
    .mock-mobile-btn { display: block; }
    .mock-flex-row { flex-direction: column; }
    .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
  }</style>
  <style>
    body {
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      margin: 0;
      padding: 2rem;
      background-color: #faf9f8;
      color: #2d3748;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
</style>
</head>
<body>
<div class="aura-light-theme">
  <div style="box-sizing: border-box; overflow-y: auto; overflow-x: hidden; width: 375px; height: 600px; box-sizing: border-box; overflow: hidden; background-color: #faf9f8; color: #2d3748; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; padding: 1.5rem 1rem; border-radius: 24px; border: 8px solid #e2e8f0; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; margin-left: auto; margin-right: auto;">
  <!-- Mobile Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.85); padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; border-top: 2px solid #3182ce;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="color: #3182ce; font-size: 1.2rem; text-shadow: 0 0 10px #3182ce;">⚡</span>
      <strong style="font-size: 1rem; letter-spacing: 1px;">DASHBOARD</strong><span style="background: rgba(49, 130, 206, 0.2); color: #3182ce; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; border: 1px solid rgba(49, 130, 206, 0.4); margin-left: 6px;">v4.0</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38a169; box-shadow: 0 0 8px #38a169;"></span>
      <span style="font-size: 1.2rem; cursor: pointer; color: #718096;">☰</span>
    </div>
  </div>
  <!-- Mobile Module Lifecycle -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-top: 2px solid #38a169; border-radius: 12px; padding: 1rem;">
    <h3 style="color: #718096; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.8rem;">Module Lifecycle (模块生命周期)</h3>
    <div id="mobile-thought-stream-container" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; padding-right: 2px;">
      <div style="background: rgba(56, 161, 105, 0.05); border-left: 3px solid #38a169; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #718096;">[16:09:17]</span> <span style="color: #2d3748;"><strong style="color:#38a169;">[START]</strong> aura-execution 模块启动</span>
      </div>
      <div style="background: rgba(49, 130, 206, 0.05); border-left: 3px solid #3182ce; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #718096;">[16:09:19]</span> <span style="color: #2d3748;"><strong style="color:#3182ce;">[MOUNT]</strong> tmpfs 读写隔离挂载成功</span>
      </div>
      <div style="background: rgba(128, 90, 213, 0.05); border-left: 3px solid #805ad5; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #718096;">[16:09:20]</span> <span style="color: #2d3748;"><strong style="color:#805ad5;">[SLEEP]</strong> aura-inference 深度休眠</span>
      </div>
      <div style="background: rgba(229, 62, 62, 0.05); border-left: 3px solid #e53e3e; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #718096;">[16:09:22]</span> <span style="color: #2d3748;"><strong style="color:#e53e3e;">[PANIC]</strong> aura-skill 内存溢出请求拦截</span>
      </div>
      <div style="background: rgba(221, 107, 32, 0.05); border-left: 3px solid #dd6b20; padding: 8px; border-radius: 0 6px 6px 0; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #718096;">[16:09:25]</span> <span style="color: #2d3748;"><strong style="color:#dd6b20;">[STOP]</strong> aura-skill 引擎已被终止</span>
      </div>
    </div>
  </div>
  <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
    <!-- Mobile Compute -->
    <div style="flex: 1; min-width: 130px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
      <h3 style="color: #3182ce; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
        <span style="display: inline-block; width: 6px; height: 6px; background: #3182ce; border-radius: 50%; box-shadow: 0 0 6px #3182ce;"></span> Compute
      </h3>
      <div style="font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #2b6cb0, #805ad5); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">12%</div>
      <div style="height: 4px; background: rgba(0,0,0,0.03); border-radius: 2px; overflow: hidden; margin-top: 0.5rem; margin-bottom: 6px;">
        <div style="width: 12%; height: 100%; background: #3182ce; box-shadow: 0 0 8px rgba(49,130,206,0.4); border-radius: 2px;"></div>
      </div>
      <div style="height: 4px; background: rgba(0,0,0,0.03); border-radius: 2px; overflow: hidden;">
        <div style="width: 45%; height: 100%; background: #805ad5; box-shadow: 0 0 8px rgba(128,90,213,0.4); border-radius: 2px;"></div>
      </div>
    </div>
    <!-- Mobile Memory -->
    <div style="flex: 1; min-width: 130px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
      <h3 style="color: #38a169; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
        <span style="display: inline-block; width: 6px; height: 6px; background: #38a169; border-radius: 50%; box-shadow: 0 0 6px #38a169;"></span> Memory
      </h3>
      <div style="font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #2f855a, #38a169); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">8.4G</div>
      <div style="height: 4px; background: rgba(0,0,0,0.03); border-radius: 2px; overflow: hidden; margin-top: 0.5rem;">
        <div style="width: 26%; height: 100%; background: #38a169; box-shadow: 0 0 8px rgba(56,161,105,0.4); border-radius: 2px;"></div>
      </div>
    </div>
  </div>
  <!-- Mobile Footer -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 0.65rem; color: #718096; margin-top: 0.5rem;">
    <span>ID: <span style="color: #3182ce;">0x9A4F2</span></span>
    <span>Up: 142h</span>
  </div>
</div>
</div>
</body>
</html>
