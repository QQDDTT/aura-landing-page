<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.1.1 移动端：核心主监控台 (Core Dashboard) (DARK)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>.mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
  .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .aura-dark-theme, .aura-dark-theme * { scrollbar-width: thin; scrollbar-color: #4a5568 #1a202c; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-track { background: #1a202c; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb:hover { background: #718096; }
  .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #9090a0; }
  .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
  .mock-footer { display: flex; justify-content: space-between; align-items: center; background: rgba(13, 17, 23, 0.7); padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); border-bottom: 2px solid #00d2ff; margin-top: 0.5rem; }
  @media (max-width: 768px) {
    .mock-nav { display: none; }
    .mock-mobile-btn { display: block; }
    .mock-flex-row { flex-direction: column; }
    .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
  }</style>
  <style>
    body {
    .aura-dark-theme, .aura-dark-theme * { scrollbar-width: thin; scrollbar-color: #4a5568 #1a202c; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-track { background: #1a202c; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb:hover { background: #718096; }
      margin: 0;
      padding: 2rem;
      background-color: #05070a;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
</style>
</head>
<body>
<div class="aura-dark-theme">
  <div style="box-sizing: border-box; overflow-y: auto; overflow-x: hidden; width: 375px; height: 600px; box-sizing: border-box; overflow: hidden; background-color: #05070a; color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; padding: 1.5rem 1rem; border-radius: 24px; border: 8px solid #1f2937; box-shadow: 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; margin-left: auto; margin-right: auto;">
  <!-- Mobile Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(13, 17, 23, 0.7); padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); border-top: 2px solid #00d2ff;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="color: #00d2ff; font-size: 1.2rem; text-shadow: 0 0 10px #00d2ff;">⚡</span>
      <strong style="font-size: 1rem; letter-spacing: 1px;">DASHBOARD</strong><span style="background: rgba(0,210,255, 0.2); color: #00d2ff; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; border: 1px solid rgba(0,210,255, 0.4); margin-left: 6px;">v4.0</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
      <span style="font-size: 1.2rem; cursor: pointer; color: #9090a0;">☰</span>
    </div>
  </div>
  <!-- Mobile Module Lifecycle -->
  <div style="background: #0d1117; border: 1px solid rgba(255,255,255,0.08); border-top: 2px solid #10b981; border-radius: 12px; padding: 1rem;">
    <h3 style="color: #9090a0; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.8rem;">Module Lifecycle (模块生命周期)</h3>
    <div id="mobile-thought-stream-container" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; padding-right: 2px;">
      <div style="background: rgba(16, 185, 129, 0.05); border-left: 3px solid #10b981; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #9090a0;">[16:09:17]</span> <span style="color: #e0e0e6;"><strong style="color:#10b981;">[START]</strong> aura-execution 模块启动</span>
      </div>
      <div style="background: rgba(0, 210, 255, 0.05); border-left: 3px solid #00d2ff; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #9090a0;">[16:09:19]</span> <span style="color: #e0e0e6;"><strong style="color:#00d2ff;">[MOUNT]</strong> tmpfs 读写隔离挂载成功</span>
      </div>
      <div style="background: rgba(147, 51, 234, 0.05); border-left: 3px solid #9333ea; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #9090a0;">[16:09:20]</span> <span style="color: #e0e0e6;"><strong style="color:#c084fc;">[SLEEP]</strong> aura-inference 深度休眠</span>
      </div>
      <div style="background: rgba(239, 68, 68, 0.05); border-left: 3px solid #ef4444; padding: 8px; border-radius: 0 6px 6px 0; margin-bottom: 0.8rem; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #9090a0;">[16:09:22]</span> <span style="color: #e0e0e6;"><strong style="color:#ef4444;">[PANIC]</strong> aura-skill 内存溢出请求拦截</span>
      </div>
      <div style="background: rgba(245, 158, 11, 0.05); border-left: 3px solid #f59e0b; padding: 8px; border-radius: 0 6px 6px 0; font-size: 0.8rem; flex-shrink: 0;">
        <span style="color: #9090a0;">[16:09:25]</span> <span style="color: #e0e0e6;"><strong style="color:#f59e0b;">[STOP]</strong> aura-skill 引擎已被终止</span>
      </div>
    </div>
  </div>
  <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
    <!-- Mobile Compute -->
    <div style="flex: 1; min-width: 130px; background: #0d1117; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1rem;">
      <h3 style="color: #00d2ff; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
        <span style="display: inline-block; width: 6px; height: 6px; background: #00d2ff; border-radius: 50%; box-shadow: 0 0 6px #00d2ff;"></span> Compute
      </h3>
      <div style="font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">12%</div>
      <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 0.5rem; margin-bottom: 6px;">
        <div style="width: 12%; height: 100%; background: #00d2ff; box-shadow: 0 0 8px #00d2ff; border-radius: 2px;"></div>
      </div>
      <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden;">
        <div style="width: 45%; height: 100%; background: #9333ea; box-shadow: 0 0 8px #9333ea; border-radius: 2px;"></div>
      </div>
    </div>
    <!-- Mobile Memory -->
    <div style="flex: 1; min-width: 130px; background: #0d1117; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1rem;">
      <h3 style="color: #10b981; font-size: 0.8rem; margin-top: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
        <span style="display: inline-block; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 6px #10b981;"></span> Memory
      </h3>
      <div style="font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">8.4G</div>
      <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 0.5rem;">
        <div style="width: 26%; height: 100%; background: #10b981; box-shadow: 0 0 8px #10b981; border-radius: 2px;"></div>
      </div>
    </div>
  </div>
  <!-- Mobile Footer -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.65rem; color: #9090a0; margin-top: 0.5rem;">
    <span>ID: <span style="color: #00d2ff;">0x9A4F2</span></span>
    <span>Up: 142h</span>
  </div>
</div>
</div>
</body>
</html>
