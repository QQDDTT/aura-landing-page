<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Editor - 探索者极客鉴权入口 (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body {
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      margin: 0;
      padding: 2rem;
      background-color: #f0f1f4;
      color: #3b4261;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
    .login-container {
      max-width: 420px;
      margin: 4rem auto;
      background-color: #ffffff;
      border: 1px solid #00d2ff;
      border-radius: 4px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      position: relative;
    }
    .scanline {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #00d2ff, transparent);
      animation: scan 3s linear infinite;
    }
    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 10px 12px;
      color: #2d3748;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      outline: none;
      margin-top: 6px;
    }
    .input-field:focus {
      border-color: #00d2ff;
    }
    .btn-action {
      width: 100%;
      background: transparent;
      border: 1px solid #00d2ff;
      color: #00d2ff;
      font-weight: bold;
      padding: 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      font-family: 'Fira Code', monospace;
      text-transform: uppercase;
    }
    .btn-action:hover {
      background: rgba(0, 210, 255, 0.05);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
    }
</style>
</head>
<body>
<div class="aura-light-theme">
  <div class="login-canvas-wrapper" style="width: 1200px; height: 620px; box-sizing: border-box; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-left: auto; margin-right: auto; background-color: #faf9f8; position: relative; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
  <div class="login-container">
    <div class="scanline"></div>
    <div style="font-family: 'Fira Code', monospace; font-size: 1.5rem; color: #00d2ff; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px;">
      <span>&gt;_</span> Aura 开发门户
    </div>
    <div style="font-size: 0.75rem; color: #718096; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 1px;">
      [Access Level: Develop | Cgroups v2]
    </div>
    <div style="display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem;">
      <div>
        <label style="font-size: 0.75rem; color: #718096; font-family: 'Fira Code', monospace;">EXPLORER_ID // 开发者账户</label>
        <input type="text" placeholder="explorer@aura-os.net" class="input-field">
      </div>
      <div>
        <label style="font-size: 0.75rem; color: #718096; font-family: 'Fira Code', monospace;">DEV_TOKEN // 隔离沙箱私有密匙</label>
        <input type="password" placeholder="••••••••••••" class="input-field">
      </div>
      <!-- Quantum Entropy Matrix Indicator -->
      <div style="background: #f8fafc; padding: 10px; border-left: 2px solid #805ad5; font-size: 0.75rem;">
        <div style="display: flex; justify-content: space-between; font-family: 'Fira Code', monospace; color: #718096; margin-bottom: 4px;">
          <span>SANDBOX_LEVEL:</span>
          <span style="color: #805ad5;">CLONE_NEWNS</span>
        </div>
        <div style="color: #4a5568;">只有开发组 Explorer 授权用户允许在此派生物理隔离的 Python 技能运行时。</div>
      </div>
    </div>
    <button class="btn-action">初始化工作区 &gt;&gt;</button>
    <div style="margin-top: 1.5rem; font-size: 0.65rem; color: #718096; font-family: 'Fira Code', monospace; text-align: center;">
      系统节点: DE7C8-E93C // 状态: 安全沙箱
    </div>
  </div>
  </div>
</div>
</body>
</html>
