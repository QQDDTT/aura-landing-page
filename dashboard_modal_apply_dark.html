<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.3.3 弹窗：配置应用确认 (Apply Confirmation Modal) (DARK)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>.mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
  .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .aura-dark-theme, .aura-dark-theme * { scrollbar-width: thin; scrollbar-color: #4a5568 #1a202c; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-track { background: #1a202c; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb:hover { background: #718096; }
  .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #9090a0; }
  .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
  .mock-footer { display: flex; justify-content: space-between; align-items: center; background: rgba(13, 17, 23, 0.7); padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); border-bottom: 2px solid #00d2ff; margin-top: 0.5rem; }
  @media (max-width: 768px) {
    .mock-nav { display: none; }
    .mock-mobile-btn { display: block; }
    .mock-flex-row { flex-direction: column; }
    .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
  }</style>
  <style>
    body {
    .aura-dark-theme, .aura-dark-theme * { scrollbar-width: thin; scrollbar-color: #4a5568 #1a202c; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-track { background: #1a202c; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    .aura-dark-theme::-webkit-scrollbar, .aura-dark-theme *::-webkit-scrollbar-thumb:hover { background: #718096; }
      margin: 0;
      padding: 2rem;
      background-color: #05070a;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
</style>
</head>
<body>
<div class="aura-dark-theme">
  <div style="margin-top: 1rem; margin-bottom: 2rem; padding: 1.5rem; background: #05070a; border: 1px solid #ef4444; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 500px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem;">
        <span style="color: #ef4444; font-size: 1.2rem;">⚠️</span>
        <h3 style="color: #ef4444; margin: 0; font-size: 1rem;">警告：人格核心重塑 (Core Override)</h3>
    </div>
    <div style="color: #e0e0e6; font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.5;">
        修改系统规则或核心参数可能导致当前活跃的认知会话发生断裂。是否强制重载新的 VFE 边界？
    </div>
    <div style="display: flex; gap: 10px; font-family: monospace; font-size: 0.75rem; margin-bottom: 1.5rem;">
        <div style="flex: 1; background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); padding: 8px; border-radius: 6px; color: #9090a0; text-decoration: line-through;">
            Old: MLP Threshold = 0.85
        </div>
        <div style="flex: 1; background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.2); padding: 8px; border-radius: 6px; color: #10b981;">
            New: MLP Threshold = 0.60
        </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <span style="padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; color: #9090a0; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);">取消 (Cancel)</span>
        <span style="padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; color: #fff; background: #ef4444; cursor: pointer; box-shadow: 0 0 10px rgba(239,68,68,0.5);">强制应用 (Force Apply)</span>
    </div>
</div>
</div>
</body>
</html>
