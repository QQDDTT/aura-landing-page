<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mobile Editor (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body style="background-color: #f5f6f9; color: #3b4261; font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center;">
  <div style="width: 375px; height: 667px; background-color: #ffffff; border: 1px solid #e2e8f0; display: flex; flex-direction: column;">
    <div style="height: 50px; border-bottom: 1px solid #00d2ff; display: flex; align-items: center; padding: 0 1rem; justify-content: space-between;">
      <div style="color: #00d2ff; font-weight: bold;">☰ Aura Editor</div>
      <div style="font-family: 'Fira Code', monospace; font-size: 0.75rem; color: #9333ea;">[Develop]</div>
    </div>
    <div style="padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 1rem;">
      <div style="background-color: #f5f6f9; padding: 1rem; border-radius: 4px; border: 1px solid #e2e8f0;">
        <div style="font-family: 'Fira Code', monospace; color: #00d2ff; font-size: 0.8rem; margin-bottom: 0.5rem;">skill.py</div>
                <div style="font-family: 'Fira Code', monospace; font-size: 0.7rem; color: #2d3748 !important; background-color: transparent !important; margin: 0; white-space: pre-wrap;"><span style="color:#a80077; font-weight:600;">def</span> <span style="color:#0066cc;">execute</span>(<span style="color:#d05000;">args</span>: <span style="color:#008080;">dict</span>) <span style="color:#555555;">-&gt;</span> <span style="color:#008080;">dict</span>:
    <span style="text-decoration: underline wavy #d97706; text-underline-offset: 2px;">unused</span> <span style="color:#555555;">=</span> <span style="color:#008000;">"x"</span>
    <span style="text-decoration: underline wavy #dc2626; text-underline-offset: 2px; background-color: rgba(220, 38, 38, 0.1);">network</span>.<span style="color:#0066cc;">fetch</span>()
    <span style="color:#a80077; font-weight:600;">return</span> {<span style="color:#008000;">"status"</span>: <span style="color:#008000;">"ok"</span>}</div>
      </div>
      <div style="margin-top: auto; display: flex; gap: 0.5rem;">
        <button style="flex: 1; background: transparent; border: 1px solid #00d2ff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; color: #00d2ff; padding: 10px; border-radius: 4px;">测试</button>
        <button style="flex: 1; background: #9333ea; border: none; color: #ffffff; padding: 10px; border-radius: 4px;">部署</button>
      </div>
    </div>
  </div>
</body>
</html>
