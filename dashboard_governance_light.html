<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.6.1 进程与 Bot 协同管理主面板 (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body { margin:0; padding:2rem; background-color:#f0f4f8; color:#1a202c; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
    .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #718096; }
    .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
    .mock-footer { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; border-bottom: 2px solid #3182ce; margin-top: 0.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    @media (max-width: 768px) {
      .mock-nav { display: none !important; }
      .mock-mobile-btn { display: block !important; }
      .mock-flex-row { flex-direction: column !important; }
      .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
    }
</head>
<body>
<div class="aura-light-theme">
<div class="mock-dash" style="width:100%;max-width:1200px;height:620px;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;margin:0 auto 2rem;background:#f8fafc;color:#1a202c;padding:1.5rem;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.08);display:flex;flex-direction:column;gap:1rem;">
  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:center;background:#ffffff;padding:0.85rem 1.5rem;border-radius:8px;border:1px solid #e2e8f0;border-top:2px solid #3182ce;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="color:#3182ce;font-size:1.4rem;">🛠️</span>
      <strong style="font-size:1.1rem;letter-spacing:1px;color:#1a202c;">AURA SYSTEM GOVERNANCE</strong>
      <span style="background:rgba(49,130,206,0.1);color:#2b6cb0;font-size:0.7rem;padding:2px 6px;border-radius:4px;border:1px solid rgba(49,130,206,0.25);">Admin Console</span>
    </div>
    <div class="mock-nav">
      <span style="font-size: 0.85rem; color: #718096; padding: 4px 8px; cursor: pointer;">Core</span>
      <span style="font-size: 0.85rem; color: #718096; padding: 4px 8px; cursor: pointer;">Audit</span>
      <span style="font-size: 0.85rem; color: #718096; padding: 4px 8px; cursor: pointer;">Memory</span>
      <span style="font-size: 0.85rem; color: #718096; padding: 4px 8px; cursor: pointer;">Persona</span>
      <span style="font-size: 0.85rem; color: #718096; padding: 4px 8px; cursor: pointer;">Settings</span>
      <div style="width: 1px; height: 14px; background: rgba(0,0,0,0.15); margin: 0 4px;"></div>
      <span style="font-size: 1rem; cursor: pointer; color: #718096;" title="切换语言 (Language)">🌐</span>
      <span style="font-size: 1rem; cursor: pointer; color: #3182ce;" title="切换主题 (Theme)">🌙</span>
    </div>
    <div style="font-size:0.8rem;color:#3182ce;display:flex;align-items:center;gap:8px;">
      <span class="mock-nav" style="display:flex;align-items:center;gap:8px;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3182ce;"></span>
        CORE KERNEL SECURE
      </span>
      <span class="mock-mobile-btn">☰</span>
    </div>
  </div>
  <!-- Main Row -->
  <div class="mock-flex-row" style="display:flex;gap:1rem;flex:1;min-height:0;">
    <!-- 左：用户列表 -->
    <div style="width:260px;flex-shrink:0;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
      <h3 style="color:#3182ce;font-size:0.85rem;margin:0;display:flex;align-items:center;justify-content:space-between;">
        <span>👥 多租户协同列表</span>
        <span style="font-size:0.7rem;background:rgba(49,130,206,0.08);color:#3182ce;padding:1px 5px;border-radius:3px;">2 Active</span>
      </h3>
      <div style="display:flex;flex-direction:column;gap:0.6rem;">
        <!-- Admin -->
        <div style="background:rgba(49,130,206,0.05);border:1px solid rgba(49,130,206,0.2);padding:10px;border-radius:8px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3182ce,#63b3ed);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#fff;font-weight:bold;">N</div>
            <div><div style="font-size:0.82rem;font-weight:bold;color:#2b6cb0;">admin_nick</div><div style="font-size:0.65rem;color:#718096;">Manage · Develop</div></div>
          </div>
          <div style="font-size:0.68rem;color:#a0aec0;font-family:monospace;">Sessions: 2 · VFE: 0.38</div>
        </div>
        <!-- Developer -->
        <div style="background:#f7fafc;border:1px solid #e2e8f0;padding:10px;border-radius:8px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#805ad5,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#fff;font-weight:bold;">A</div>
            <div><div style="font-size:0.82rem;font-weight:bold;color:#4a5568;">explorer_alex</div><div style="font-size:0.65rem;color:#718096;">Develop</div></div>
          </div>
          <div style="font-size:0.68rem;color:#a0aec0;font-family:monospace;">Sessions: 1 · VFE: 0.61</div>
        </div>
      </div>
      <button style="padding:8px;border-radius:6px;border:1px dashed #e2e8f0;background:#f7fafc;color:#a0aec0;font-size:0.78rem;cursor:pointer;width:100%;">+ 邀请/添加协同用户</button>
      <!-- 系统资源概览 -->
      <div style="background:#f7fafc;border-radius:8px;padding:0.8rem;border:1px solid #e2e8f0;">
        <div style="font-size:0.72rem;color:#4a5568;font-weight:bold;margin-bottom:0.5rem;">系统资源概览</div>
        <div style="display:flex;flex-direction:column;gap:0.4rem;">
          <div style="display:flex;justify-content:space-between;font-size:0.72rem;"><span style="color:#718096;">CPU</span><span style="color:#3182ce;font-family:monospace;">3.7%</span></div>
          <div style="height:3px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-bottom:2px;"><div style="width:3.7%;height:100%;background:#3b82f6;border-radius:2px;"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:0.72rem;"><span style="color:#718096;">RAM</span><span style="color:#805ad5;font-family:monospace;">312 MB</span></div>
          <div style="height:3px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-bottom:2px;"><div style="width:31%;height:100%;background:#805ad5;border-radius:2px;"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:0.72rem;"><span style="color:#718096;">Disk I/O</span><span style="color:#10b981;font-family:monospace;">1.2 MB/s</span></div>
        </div>
      </div>
    </div>
    <!-- 右区域 -->
    <div style="flex:1;display:flex;flex-direction:column;gap:1rem;min-width:0;">
      <!-- 进程监控 -->
      <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h4 style="margin:0;color:#3182ce;font-size:0.85rem;font-weight:bold;display:flex;align-items:center;gap:6px;"><span>🖥️</span> 系统核心进程督导 (Process Monitor)</h4>
          <span style="font-family:monospace;font-size:0.72rem;color:#10b981;background:rgba(16,185,129,0.08);padding:2px 8px;border-radius:4px;">STATUS: HEALTHY</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <!-- aura-os -->
          <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px 12px;border-radius:6px;border:1px solid #e2e8f0;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#10b981;"></span>
              <span style="font-size:0.8rem;font-family:monospace;color:#2d3748;">aura-os</span>
              <span style="font-size:0.65rem;color:#a0aec0;">PID 1 · Supervisor</span>
            </div>
            <span style="font-size:0.72rem;color:#718096;">CPU: 1.5% | MEM: 42MB</span>
            <button style="padding:3px 8px;border-radius:4px;font-size:0.7rem;background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);color:#dc2626;cursor:pointer;">Restart</button>
          </div>
          <!-- aura-skill-developer -->
          <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px 12px;border-radius:6px;border:1px solid #e2e8f0;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#10b981;"></span>
              <span style="font-size:0.8rem;font-family:monospace;color:#2d3748;">aura-skill-developer</span>
              <span style="font-size:0.65rem;color:#a0aec0;">PID 823</span>
            </div>
            <span style="font-size:0.72rem;color:#718096;">CPU: 0.2% | MEM: 68MB</span>
            <button style="padding:3px 8px;border-radius:4px;font-size:0.7rem;background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);color:#dc2626;cursor:pointer;">Restart</button>
          </div>
          <!-- aura-interaction -->
          <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px 12px;border-radius:6px;border:1px solid #e2e8f0;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#10b981;"></span>
              <span style="font-size:0.8rem;font-family:monospace;color:#2d3748;">aura-interaction</span>
              <span style="font-size:0.65rem;color:#a0aec0;">PID 1024</span>
            </div>
            <span style="font-size:0.72rem;color:#718096;">CPU: 0.8% | MEM: 55MB</span>
            <button style="padding:3px 8px;border-radius:4px;font-size:0.7rem;background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);color:#dc2626;cursor:pointer;">Restart</button>
          </div>
          <!-- aura-inference (busy) -->
          <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(147,51,234,0.04);padding:8px 12px;border-radius:6px;border:1px solid rgba(147,51,234,0.15);">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:8px;height:8px;border-radius:50%;background:#805ad5;"></span>
              <span style="font-size:0.8rem;font-family:monospace;color:#2d3748;">aura-inference</span>
              <span style="font-size:0.65rem;color:#805ad5;">PID 2048 · Busy</span>
            </div>
            <span style="font-size:0.72rem;color:#718096;">CPU: 18.3% | MEM: 128MB</span>
            <button style="padding:3px 8px;border-radius:4px;font-size:0.7rem;background:rgba(220,38,38,0.06);border:1px solid rgba(220,38,38,0.2);color:#dc2626;cursor:pointer;">Restart</button>
          </div>
        </div>
      </div>
      <!-- Bot 网关集群 -->
      <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem;flex:1;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
        <h4 style="margin:0;color:#805ad5;font-size:0.85rem;font-weight:bold;display:flex;align-items:center;gap:6px;"><span>🤖</span> Telegram 机器人网关集群 (Bots Gateway)</h4>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:10px 14px;border-radius:8px;border:1px solid #e2e8f0;">
            <div style="display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:0.85rem;font-weight:bold;color:#2d3748;">@aura_primary_bot</span>
              <span style="font-size:0.65rem;color:#718096;">消费接入端点 · Active · 2 users</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:0.72rem;color:#10b981;font-family:monospace;">Latency: 82ms</span>
              <span style="background:#10b981;width:36px;height:20px;border-radius:10px;display:inline-block;position:relative;cursor:pointer;">
                <span style="width:16px;height:16px;border-radius:50%;background:#ffffff;position:absolute;top:2px;right:2px;"></span>
              </span>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:10px 14px;border-radius:8px;border:1px solid #e2e8f0;opacity:0.6;">
            <div style="display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:0.85rem;font-weight:bold;color:#a0aec0;">@aura_dev_bot</span>
              <span style="font-size:0.65rem;color:#a0aec0;">开发测试端点 · Disabled</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span style="font-size:0.72rem;color:#a0aec0;font-family:monospace;">Latency: --</span>
              <span style="background:#e2e8f0;width:36px;height:20px;border-radius:10px;display:inline-block;position:relative;cursor:pointer;">
                <span style="width:16px;height:16px;border-radius:50%;background:#a0aec0;position:absolute;top:2px;left:2px;"></span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <div class="mock-footer" style="display:flex;justify-content:space-between;align-items:center;background:#ffffff;padding:0.7rem 1.5rem;border-radius:8px;border:1px solid #e2e8f0;border-bottom:2px solid #3182ce;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
    <div style="font-size:0.75rem;color:#718096;">
      TraceID: <span style="color:#3182ce;font-family:monospace;">0xFA92C-A11B</span> &nbsp;|&nbsp; Mode: <span style="color:#3182ce;font-family:monospace;">System Governance</span>
    </div>
    <div style="display:flex;gap:1.5rem;">
      <span style="font-size:0.75rem;color:#10b981;">4 Processes Healthy</span>
      <span style="font-size:0.75rem;color:#718096;">2 Active Users</span>
      <span style="font-size:0.75rem;color:#718096;">Aura OS Core Platform</span>
    </div>
  </div>
</div>
</div>
</body>
</html>
