<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard - 5.2.1 移动端：记忆拓扑与缓存透视台 (Mobile Memory Explorer) (LIGHT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>.mock-dash { display: flex; flex-direction: column; gap: 1.5rem; }
  .mock-nav { display: flex; gap: 1rem; align-items: center; }
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .mock-mobile-btn { display: none; font-size: 1.2rem; cursor: pointer; color: #4a5568; }
  .mock-flex-row { display: flex; gap: 1.5rem; align-items: stretch; flex-wrap: wrap; }
  .mock-footer { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 0.8rem 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; border-bottom: 2px solid #3182ce; margin-top: 0.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  @media (max-width: 768px) {
    .mock-nav { display: none; }
    .mock-mobile-btn { display: block; }
    .mock-flex-row { flex-direction: column; }
    .mock-footer { font-size: 0.65rem; flex-direction: column; gap: 8px; padding: 10px; align-items: flex-start; }
  }</style>
  <style>
    body {
    .aura-light-theme, .aura-light-theme * { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar { width: 4px; height: 4px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .aura-light-theme::-webkit-scrollbar, .aura-light-theme *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      margin: 0;
      padding: 2rem;
      background-color: #faf9f8;
      color: #2d3748;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    }
</style>
</head>
<body>
<div class="aura-light-theme">
  <div style="width: 375px; height: 600px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; width: 375px; background-color: #faf9f8; color: #2d3748; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; padding: 1.5rem 1rem; border-radius: 24px; border: 8px solid #e2e8f0; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; margin-left: auto; margin-right: auto;">
  <!-- Mobile Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.85); padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; border-top: 2px solid #38a169;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="color: #38a169; font-size: 1.2rem; text-shadow: 0 0 10px #38a169;">🌌</span>
      <strong style="font-size: 1rem; letter-spacing: 1px;">MEMORY CORE</strong><span style="background: rgba(56, 161, 105, 0.2); color: #38a169; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; border: 1px solid rgba(56, 161, 105, 0.4); margin-left: 6px;">v4.0</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38a169; box-shadow: 0 0 8px #38a169;"></span>
      <span style="font-size: 1.2rem; cursor: pointer; color: #718096;">☰</span>
    </div>
  </div>
  <!-- Context Switcher -->
  <div style="background: rgba(255, 255, 255, 0.85); padding: 0.6rem; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
    <select style="background: #f7fafc; color: #2d3748; border: 1px solid #cbd5e0; padding: 4px; border-radius: 4px; outline: none; font-size: 0.7rem;">
      <option>Global Map</option>
      <option>#4A9B (Active)</option>
    </select>
    <button style="background: rgba(229,62,62,0.1); border: 1px solid rgba(229,62,62,0.3); color: #e53e3e; border-radius: 4px; font-size: 0.65rem; padding: 4px 6px;">Purge</button>
  </div>
  <!-- Mobile Storage Usage -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
    <h3 style="color: #38a169; font-size: 0.8rem; margin-top: 0; margin-bottom: 1rem;">Substrate Cache (底层缓存)</h3>
    <div style="margin-bottom: 0.8rem;">
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #718096; margin-bottom: 4px;"><span>Block-E</span> <span>78%</span></div>
      <div style="height: 4px; background: rgba(0, 0, 0, 0.03); border-radius: 2px; display: flex; overflow: hidden;">
        <div style="width: 40%; height: 100%; background: #38a169; border-right: 1px solid #fff;"></div>
        <div style="width: 25%; height: 100%; background: #48bb78; border-right: 1px solid #fff;"></div>
        <div style="width: 13%; height: 100%; background: #68d391;"></div>
      </div>
      <div style="font-size: 0.6rem; color: #a0aec0; margin-top: 4px; display: flex; justify-content: space-between;"><span>#4A9B (40%)</span> <span>#8F22 (25%)</span></div>
    </div>
    <div style="margin-bottom: 0.8rem;">
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #718096; margin-bottom: 4px;"><span>Block-I</span> <span>34%</span></div>
      <div style="height: 4px; background: rgba(0, 0, 0, 0.03); border-radius: 2px; display: flex; overflow: hidden;">
        <div style="width: 18%; height: 100%; background: #3182ce; border-right: 1px solid #fff;"></div>
        <div style="width: 10%; height: 100%; background: #4299e1; border-right: 1px solid #fff;"></div>
        <div style="width: 6%; height: 100%; background: #63b3ed;"></div>
      </div>
    </div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #718096; margin-bottom: 4px;"><span>Block-L</span> <span>92% (⚠)</span></div>
      <div style="height: 4px; background: rgba(0, 0, 0, 0.03); border-radius: 2px; display: flex; overflow: hidden;">
        <div style="width: 50%; height: 100%; background: #e53e3e; border-right: 1px solid #fff;"></div>
        <div style="width: 30%; height: 100%; background: #f56565; border-right: 1px solid #fff;"></div>
        <div style="width: 12%; height: 100%; background: #fc8181;"></div>
      </div>
    </div>
  </div>
  <!-- Mobile Node Graph -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 120px;">
    <div style="position: absolute; top: 0.5rem; left: 1rem; color: #718096; font-size: 0.7rem;">Task Clusters (多租户星系)</div>
    <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
       <line x1="30%" y1="50%" x2="70%" y2="50%" stroke="rgba(0,0,0,0.1)" stroke-width="1" stroke-dasharray="2,4"/>
    </svg>
    <div style="display: flex; gap: 2rem; align-items: center; margin-top: 1rem;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(56,161,105,0.2) 0%, transparent 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.6rem; color: #38a169; font-weight: bold;">
        #4A9B<br><span style="font-size: 0.5rem; color: #718096; font-weight: normal;">142 nodes</span>
      </div>
      <div style="width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(49,130,206,0.2) 0%, transparent 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.6rem; color: #3182ce; font-weight: bold;">
        #8F22<br><span style="font-size: 0.5rem; color: #718096; font-weight: normal;">289 nodes</span>
      </div>
    </div>
  </div>
  <!-- Mobile Footer -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 0.65rem; color: #718096; margin-top: 0.5rem;">
    <span>ID: <span style="color: #3182ce;">0x9A4F2</span></span>
    <span>Up: 142h</span>
  </div>
</div>
</div>
</body>
</html>
